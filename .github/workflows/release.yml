name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing: npm checks this repository and workflow through GitHub's OIDC token, so no npm token is
    # stored anywhere. It needs the trusted publisher set once on npmjs.com (package songlinks → Settings → Trusted
    # publisher: GitHub Actions, Alexkane/songlinks-js, workflow release.yml). npm also adds provenance by itself.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older npm.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      # prepublishOnly runs typecheck, docs:check, tests and the build before anything is uploaded.
      - run: npm publish --access public
